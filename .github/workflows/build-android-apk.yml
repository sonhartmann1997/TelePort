name: Build TelePort Universal APK

on:
  workflow_dispatch:
    inputs:
      apk_version:
        description: "APK Version Name (z. B. 1.0.0)"
        required: false
        default: "1.0.0"
  push:
    branches:
      - main
      - master
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_DIR" ] && [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Prepare optional Release Keystore
        id: keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/teleport-release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "keystore_file=$RUNNER_TEMP/teleport-release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "keystore_file=" >> "$GITHUB_OUTPUT"
            echo "::notice::Keine Release-Keystore-Secrets hinterlegt – baue signierte Debug-APK als Fallback. Für nahtlose Updates ohne Neuinstallation hinterlege ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS und ANDROID_KEY_PASSWORD."
          fi

      - name: Build Universal APK (Mobile, Android TV & Fire TV)
        working-directory: android-app
        env:
          APK_VERSION_NAME: ${{ github.event.inputs.apk_version || '1.0.0' }}
          APK_VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ steps.keystore.outputs.keystore_file }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../TelePort-Universal.apk
          else
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../TelePort-Universal.apk
          fi
          ls -lh ../TelePort-Universal.apk

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelePort-Universal-APK
          path: TelePort-Universal.apk
          retention-days: 90

      - name: Publish Rolling GitHub Release (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          target_commitish: ${{ github.sha }}
          name: "TelePort Universal APK (${{ github.event.inputs.apk_version || '1.0.0' }})"
          body: |
            Universelle TelePort APK für Android Smartphones, Tablets, Android TV, Google TV und Amazon Fire TV Sticks (32- & 64-Bit).

            Direkter Kurz-Download über deinen Cloudflare-Worker: `/download/teleport.apk`
          files: TelePort-Universal.apk
          make_latest: true
